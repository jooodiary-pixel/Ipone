<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Character iPhone</title><link rel="stylesheet" href="style.css"></head><body><main><div class="topbar"><strong>Character iPhone · 17 Pro</strong><button id="editorToggle">✎ 작가 편집</button></div><div class="layout"><div class="phone"><div class="screen" id="screen"><div class="island"></div><div class="status"><span id="clock">9:41</span><span>▮▮▮ ◕ ▰</span></div><div id="view"></div><div class="homebar" id="homebar"></div></div></div><aside id="editor" class="editor hidden"><h2>작가 편집 모드</h2><p>내용을 고치고 ‘미리보기 적용’을 누르세요. 독자에게 공개하려면 JSON을 내려받아 프로젝트의 <code>content.json</code> 파일을 교체한 뒤 다시 배포하세요.</p><label>캐릭터 이름<input id="characterName"></label><label>잠금화면 문구<input id="lockSubtitle"></label><label>배경 이미지 URL (https://)<input id="wallpaper"></label><label>메시지·연락처·메모·사진 데이터 (JSON)<textarea id="jsonEditor" spellcheck="false"></textarea></label><div class="actions"><button id="apply">미리보기 적용</button><button id="save">JSON 다운로드</button><label class="upload">JSON 불러오기<input type="file" id="upload" accept=".json,application/json" hidden></label></div><p id="feedback" role="status"></p><p class="tip">사진은 직접 공개 가능한 이미지 URL을 사용하세요. 개인정보나 실제 연락처는 넣지 않는 것이 좋아요.</p></aside></div><footer>Fictional phone experience · Apple 공식 제품 또는 운영체제가 아닙니다.</footer></main><script src="app.js"></script></body></html>
